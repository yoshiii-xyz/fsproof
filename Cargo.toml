[package]
name = "fsproof"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Reconcile filesystem notifications with bounded snapshots"
license = "MIT"
repository = "https://github.com/yoshiii-xyz/fsproof"
keywords = ["filesystem", "watcher", "inotify", "events"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
notify = "8.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.23"
